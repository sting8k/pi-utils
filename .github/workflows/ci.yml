# CI — minimal and least-privilege:
# - no secrets are used anywhere in this workflow
# - token limited to contents: read, never persisted in the checkout
# - third-party actions pinned to commit SHAs (tags are mutable)
# - pull_request (not pull_request_target): fork PRs get no write access
name: CI

on:
  push:
    branches: [main]
  pull_request:

# New pushes to the same branch supersede older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: pi-utils
          persist-credentials: false

      # The dev dependency "@sting8k/pi-droid-styling": "file:../pi-droid-styling"
      # points at a sibling checkout that only exists on dev machines (for live
      # pi rendering). CI never imports the real package — tests pin a stub or
      # an unresolvable specifier — so a minimal stand-in sibling satisfies the
      # file: resolution and the install proceeds.
      - name: Stub sibling droid-styling package
        run: |
          mkdir -p pi-droid-styling
          printf '{"name":"@sting8k/pi-droid-styling","version":"2.13.0","type":"module"}' \
            > pi-droid-styling/package.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # fs-search tests exercise the real ripgrep binary (resolver: PATH first).
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Install
        working-directory: pi-utils
        run: bun install

      - name: Check (biome + tsc)
        working-directory: pi-utils
        run: bun run check

      - name: Test
        working-directory: pi-utils
        run: bun test
